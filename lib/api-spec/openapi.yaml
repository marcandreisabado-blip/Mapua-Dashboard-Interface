openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: found items
    description: Public found-item listings and reporting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /items:
    get:
      operationId: listFoundItems
      tags: [found items]
      summary: Search found items
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            minLength: 10
            maxLength: 10
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            minLength: 10
            maxLength: 10
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - Electronics
              - Personal items
              - School supplies
              - Clothing & accessories
              - Keys & cards
              - Other
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching found items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoundItem"
        "400":
          description: Invalid search filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createFoundItem
      tags: [found items]
      summary: Report an item found on campus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundItemInput"
      responses:
        "201":
          description: Saved found item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundItem"
        "400":
          description: Invalid found-item report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /items/stats:
    get:
      operationId: getFoundItemStats
      tags: [found items]
      summary: Get current found-item totals
      responses:
        "200":
          description: Found-item totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundItemStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FoundItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        publicDescription:
          type: string
        location:
          type: string
        foundAt:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        status:
          type: string
          enum: [available, returned]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - publicDescription
        - location
        - foundAt
        - status
        - createdAt
    FoundItemInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          enum:
            - Electronics
            - Personal items
            - School supplies
            - Clothing & accessories
            - Keys & cards
            - Other
        publicDescription:
          type: string
          minLength: 3
          maxLength: 500
        location:
          type: string
          minLength: 2
          maxLength: 160
        foundAt:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      required:
        - name
        - category
        - publicDescription
        - location
        - foundAt
    FoundItemStats:
      type: object
      properties:
        totalItems:
          type: integer
        availableItems:
          type: integer
      required:
        - totalItems
        - availableItems
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

